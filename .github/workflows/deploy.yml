name: Test and deploy model-wheel bundle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest ruff
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Build wheel
        run: python -m build
      - name: Install wheel and run tests
        run: |
          python -m pip install dist/*.whl
          pytest -q

  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    needs: test
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: databricks/setup-cli@main
      - name: Install bundle build dependency
        run: python -m pip install --upgrade build
      - name: Build Python Wheel Artifact
        run: python -m build
      - name: Validate bundle
        run: databricks bundle validate -t dev
      - name: Deploy bundle
        run: databricks bundle deploy -t dev
      - name: Run model registration and serving job
        run: databricks bundle run -t dev --resource model_wheel_deploy

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: databricks/setup-cli@main
      - name: Install bundle build dependency
        run: python -m pip install --upgrade build
      - name: Build Python Wheel Artifact
        run: python -m build
      - name: Validate bundle
        run: databricks bundle validate -t prod
      - name: Deploy bundle
        run: databricks bundle deploy -t prod
      - name: Run model registration and serving job
        run: databricks bundle run -t prod model_wheel_deploy
