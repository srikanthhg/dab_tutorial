bundle:
  name: dab-tutorial-model-wheel

include:
  - resources/*.yml
  - resources/*/*.yml


variables:      # catalog variables defined in resources folder. we can define variables in either ways databricks.yml or resources folder
  schema:
    description: Unity Catalog schema for the registered model.
    default: mlflow_demo
  llm_model:
    description: Existing Databricks Model Serving endpoint used by the agent.
    default: databricks-meta-llama-3-3-70b-instruct
  serving_endpoint:
    description: Model Serving endpoint managed by this target.
    default: model-wheel-agent
  experiment_name:
    description: Workspace MLflow experiment used to track model registration runs.
    default: /Shared/model-wheel

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405609931845875.15.azuredatabricks.net
    variables:
      schema: mlflow_demo_dev
      serving_endpoint: model-wheel-dev-agent
      experiment_name: /Shared/model-wheel-dev

  prod:
    mode: production
    workspace:
      host: https://adb-7405609931845875.15.azuredatabricks.net
    variables:
      schema: mlflow_demo
      serving_endpoint: model-wheel-agent
      experiment_name: /Shared/model-wheel-prod
    permissions:
      - 
