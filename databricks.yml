bundle:
  name: dab-tutorial-model-wheel

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m build

variables:
  catalog:
    description: Unity Catalog catalog for the registered model.
    default: main
  schema:
    description: Unity Catalog schema for the registered model.
    default: mlflow_demo
  llm_model:
    description: Existing Databricks Model Serving endpoint used by the agent.
    default: databricks-meta-llama-3-3-70b-instruct
  serving_endpoint:
    description: Model Serving endpoint managed by this target.
    default: model-wheel-agent

targets:
  dev:
    default: true
    mode: development
    variables:
      schema: mlflow_demo_dev
      serving_endpoint: model-wheel-dev-agent

  prod:
    mode: production
    variables:
      schema: mlflow_demo
      serving_endpoint: model-wheel-agent
