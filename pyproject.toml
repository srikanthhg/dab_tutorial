[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-wheel-demo"
version = "0.2.0"
description = "Databricks MLflow agent deployed with Databricks Asset Bundles"
requires-python = ">=3.12"
dependencies = [
    "databricks-langchain==0.6.0",
    "langchain==0.3.14",
    "langchain-core==0.3.29",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "mlflow>=3.1,<4", "databricks-sdk>=0.50,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
