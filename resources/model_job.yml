resources:
  jobs:
    model_wheel_deploy:
      name: model-wheel-${bundle.target}-deploy
      description: Register the agent in Unity Catalog and configure its serving endpoint.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: register_and_serve
          python_wheel_task:
            package_name: model_wheel_demo
            entry_point: register-model
            parameters:
              - --model-name
              - ${var.catalog}.${var.schema}.demo_agent
              - --llm-model
              - ${var.llm_model}
              - --serving-endpoint
              - ${var.serving_endpoint}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
