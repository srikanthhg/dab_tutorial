resources:
  jobs:
    model_wheel_promote_champion:
      name: model-wheel-${bundle.target}-promote-champion
      description: Explicitly promote a selected registered model version to Champion after serving validation.
      max_concurrent_runs: 1
      tasks:
        - task_key: promote_champion
          python_script_task:
            python_file: scripts/promote_champion.py
            source: WORKSPACE
            parameters:
              - --model-name
              - ${var.catalog}.${var.schema}.demo_agent
              - --model-version
              - ${var.model_version}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - "databricks-sdk>=0.50,<1"
